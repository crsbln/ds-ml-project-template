[project]
name = "kickstarter-success-prediction"
version = "1.0.0"
description = "Estimate the chance that a Kickstarter campaign gets funded, before launch."
authors = [{ name = "Chris Balan" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "joblib>=1.5.3",
    "kagglehub>=0.3.12",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "scikit-learn==1.9.0",
    "seaborn>=0.13.2",
]

[project.scripts]
kickstarter-download = "kickstarter.download:main"
kickstarter-train = "kickstarter.train:main"
kickstarter-check = "kickstarter.check:main"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbformat>=5.10.4",
    "pytest>=8.4.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kickstarter"]

[tool.ruff]
line-length = 88
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
