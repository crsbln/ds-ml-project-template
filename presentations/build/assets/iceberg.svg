<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="2000" height="880">
  <style>
    text { font-family: Calibri, Arial, sans-serif; }
    .sea { stroke: #6FC29C; stroke-width: 2.5; }
    .peak { stroke: #05CE78; stroke-width: 2.5; stroke-linejoin: round; }
    .peak-facet { fill: none; stroke: rgba(5,206,120,.35); stroke-width: 1.5; }
    .facet { fill: rgba(255,255,255,.05); } .f2 { fill: rgba(255,255,255,.08); } .f3 { fill: rgba(0,0,0,.12); }
    .side { font-size: 15px; font-weight: 700; letter-spacing: 2px; } .ok { fill: #037A47; } .no { fill: #2E3431; }
    .seen { font-size: 30px; font-weight: 700; fill: #1F2421; } .seen-sub { font-size: 17px; fill: #5D6863; }
    .hidden-label text { font-size: 19px; font-weight: 700; fill: #FFFFFF; }
    .ico { fill: none; stroke: #8FE3BB; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .eye path { fill: none; stroke-width: 3; } .eye.ok path { stroke: #05CE78; } .eye.ok circle { fill: #05CE78; }
    .eye.no path { stroke: #2E3431; } .eye.no circle { fill: #2E3431; } .eye.no line { stroke: #2E3431; stroke-width: 4; stroke-linecap: round; }
    .sight { stroke: #05CE78; stroke-width: 2; stroke-dasharray: 6 7; }
  </style>
